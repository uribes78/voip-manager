[general]
enabled=yes
port=5038
bindaddr=0.0.0.0
displayconnects=no

[${AMI_USER}]
secret=${AMI_SECRET}
deny=0.0.0.0/0.0.0.0
permit=127.0.0.1/255.255.255.255
permit=172.16.0.0/255.240.0.0   ; red de Docker: desde ahí conecta la API
; AMI escucha en 0.0.0.0 porque Asterisk corre en la red del host; bloquea 5038 desde fuera con el firewall (ver docs/DEPLOY.md).
read=system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate
write=system,call,command,agent,user,config,originate,reporting
eventfilter=!Event: RTCP*
eventfilter=!Event: VarSet
