; Los contextos deben declararse aquí para que pbx_realtime los consulte en la tabla `extensions`.
; Agrega un bloque por cada contexto nuevo y ejecuta "dialplan reload" (o usa el snippet generado por el servicio).
[general]
static=yes
writeprotect=yes
clearglobalvars=no

[from-internal]
switch => Realtime/from-internal@extensions

[from-trunk]
switch => Realtime/from-trunk@extensions

[from-queue]
switch => Realtime/from-queue@extensions
