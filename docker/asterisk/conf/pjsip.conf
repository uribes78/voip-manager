[global]
type=global
user_agent=Asterisk voip-manager
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Con Docker en modo bridge (desarrollo) Asterisk tiene IP propia: anuncia la IP del host para los teléfonos de la LAN.
; local_net = red interna de Docker (los softphones del propio host llegan por ahí). Vacío = sin sustitución.
external_signaling_address=${EXTERNAL_ADDRESS}
external_media_address=${EXTERNAL_ADDRESS}
local_net=${LOCAL_NET}

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
